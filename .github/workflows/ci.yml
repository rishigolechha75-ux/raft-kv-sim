name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Tests
        run: pytest -v
      - name: Short simulation campaign (correct implementation must have zero failures)
        run: raftkv sim --seeds 100 --profile chaos

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t raftkv:ci .
      - name: Smoke test 3-node cluster with docker compose
        run: |
          docker compose up -d
          sleep 4
          docker compose exec -T n0 raftkv put --cluster n0=n0:7000,n1=n1:7000,n2=n2:7000 hello world
          docker compose exec -T n1 raftkv get --cluster n0=n0:7000,n1=n1:7000,n2=n2:7000 hello | grep world
          docker compose down
